[package]
name = "zownload"
version = "0.1.0"
description = "A local-first media download application foundation"
authors = ["Zownload contributors"]
edition = "2021"

[lib]
name = "zownload_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.3", features = ["custom-protocol"] }
